[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-cadplan"
version = "0.2.1"
description = "NetBox plugin: visual floor-plan management linked to Sites and Locations, with DXF/DWG import"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "G1tHub-PRO" },
    { name = "SelfSimon" },
]
keywords = ["netbox", "plugin", "plan", "floorplan", "dxf", "dwg", "sites", "locations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = ["ezdxf", "svgwrite"]

[project.urls]
Homepage = "https://github.com/SelfSimon/netbox-cadplan"
Repository = "https://github.com/SelfSimon/netbox-cadplan"
"Bug Tracker" = "https://github.com/SelfSimon/netbox-cadplan/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.12.0",
    "black>=23.0",
    "pre-commit>=2.20",
]

[tool.setuptools.packages.find]
include = ["netbox_cadplan*"]

[tool.setuptools.package-data]
netbox_cadplan = ["templates/**/*", "static/**/*", "locale/**/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["E", "F", "W"]
